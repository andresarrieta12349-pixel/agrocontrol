version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: agrocontrol_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: agrocontrol
      POSTGRES_PASSWORD: agrocontrol_secret
      POSTGRES_DB: agrocontrol_pro

    ports:
      - "5432:5432"

    volumes:
      - agrocontrol_pg_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U agrocontrol -d agrocontrol_pro
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: agrocontrol_backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg2://agrocontrol:agrocontrol_secret@db:5432/agrocontrol_pro
      JWT_SECRET_KEY: cambia-esta-clave-en-produccion-agrocontrol-pro
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      CORS_ORIGINS: "*"
      # Credenciales de Google Cloud OAuth 2.0 (definidas en el archivo .env
      # de la raíz del proyecto; NUNCA se hardcodean aquí).
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google/callback}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # Google reordena/expande los nombres de los "scopes" al responder
      # (p.ej. "email" -> "https://www.googleapis.com/auth/userinfo.email").
      # Esto es normal y no representa un problema de seguridad, pero la
      # librería oauthlib es estricta por defecto y lo rechaza. Esta
      # variable le indica que acepte esa diferencia de formato.
      OAUTHLIB_RELAX_TOKEN_SCOPE: "1"

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

  frontend:
    image: nginx:1.27-alpine
    container_name: agrocontrol_frontend
    restart: unless-stopped

    volumes:
      - ./frontend:/usr/share/nginx/html:ro

    ports:
      - "8080:80"

    depends_on:
      - backend

volumes:
  agrocontrol_pg_data: